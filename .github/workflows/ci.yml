name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, build, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Isolated SQLite file for tests; never dev.db
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Generate Prisma client
        run: pnpm prisma generate --config prisma7.config.ts
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Apply migrations to test database
        run: pnpm prisma migrate deploy --config prisma7.config.ts
      - run: pnpm test:e2e

  web:
    name: Web (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Generate route tree
        run: pnpm generate:routes
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
