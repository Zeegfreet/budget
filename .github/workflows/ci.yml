name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, build, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated test database (the e2e reset refuses anything not *_test)
      DATABASE_URL: postgresql://budget:budget@localhost:5432/budget_test
      # Required by the API's env validation; test-only value
      JWT_ACCESS_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Generate Prisma client
        run: pnpm prisma generate --config prisma7.config.ts
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Apply migrations to test database
        run: pnpm prisma migrate deploy --config prisma7.config.ts
      - run: pnpm test:e2e

  web:
    name: Web (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Generate route tree
        run: pnpm generate:routes
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Publishing happens in docker.yml on version tags
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
