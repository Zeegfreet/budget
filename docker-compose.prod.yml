# Production example: Traefik (HTTPS with Let's Encrypt) + the Budget image +
# PostgreSQL. Copy .env.prod.example to .env.prod, fill it in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# The DNS of $DOMAIN must point to this server (ports 80 and 443 open).
services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  app:
    image: zeegfreet/budget:${BUDGET_TAG:-latest}
    env_file: .env.prod
    environment:
      # Behind Traefik: rate limiting by the real client IP
      TRUST_PROXY: '1'
      WEB_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.budget.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.budget.entrypoints=websecure
      - traefik.http.routers.budget.tls.certresolver=letsencrypt
      - traefik.http.services.budget.loadbalancer.server.port=3000
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budget -d budget']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  letsencrypt:
  pgdata:
